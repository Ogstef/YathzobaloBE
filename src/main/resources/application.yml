spring:
  application:
    name: YathzoBalo

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    jwt:
      secret: YathzoBaloBaloYathzoSuperSecretKeyForJWTTokenGeneration2024MustBeLongEnoughForHS256Algorithm131299
      expiration: 86400000  # 24 hours (in milliseconds)
      refresh-expiration: 604800000  # 7 days (in milliseconds)
      header: Authorization
      prefix: "Bearer "

server:
  address: 0.0.0.0
  port: 8085

web:
  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"

# Application specific settings
app:
  default-admin:
    username: admin
    password: admin123
    email: admin@yathzobalo.com
    display-name: Administrator
  game:
    max-concurrent-games: 10
    default-timeout: 1800000  # 30 minutes
  leaderboard:
    max-entries: 100

logging:
  level:
    com.YathzoBalo: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG